# Interface statique (application monopage) : les routes inconnues renvoient index.html.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
