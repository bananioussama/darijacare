# Source des fiches (contenu FICTIF). Après génération, les fiches Markdown de kb/ font foi.
relocation:
  title_fr: Déménagement de la ligne fixe ou de l'internet
  objet_fr: Expliquer comment transférer sa ligne fixe ou son abonnement internet vers une nouvelle adresse.
  etapes_fr:
    - Vérifier l'éligibilité de la nouvelle adresse (voir « Éligibilité à la fibre »).
    - Déposer une demande de transfert d'adresse depuis l'espace client ou en agence, idéalement avant le déménagement.
    - Fournir la nouvelle adresse complète et un justificatif si demandé.
    - Choisir le rendez-vous d'installation à la nouvelle adresse et conserver le matériel (box, décodeur).
  conditions_fr:
    - La demande est faite par le titulaire de l'abonnement.
    - L'abonnement doit être à jour de ses paiements.
  limites_fr:
    - Si la nouvelle adresse n'est pas éligible à la même technologie, une autre offre peut être proposée.
    - Le numéro fixe peut changer selon la zone.
  escalade_fr: Pour un déménagement vers une autre ville ou un cas complexe, proposer un conseiller.
  title_ar: نرحل الخط الثابت ولا الأنترنيت لدار جديدة
  objet_ar: نشرحو كيفاش تنقل الخط الثابت ولا الاشتراك ديال الأنترنيت لعنوان جديد.
  etapes_ar:
    - تأكد من الأهلية ديال العنوان الجديد (شوف «واش لافيبر كاينة عندي»).
    - دير طلب ديال تبديل العنوان من الفضاء ديال الكليان ولا فالوكالة، والأحسن قبل ما ترحل.
    - عطي العنوان الجديد كامل وشي وثيقة إلا طلبوها.
    - اختار الموعد ديال التركيب فالعنوان الجديد واحتافظ بالأجهزة (البوكس، الديكودور).
  conditions_ar:
    - مول الاشتراك هو اللي كيدير الطلب.
    - خاص الاشتراك يكون مخلص.
  limites_ar:
    - إلا العنوان الجديد ما فيهش نفس التكنولوجيا، يقدر يتقترح عرض آخر.
    - رقم الفيكس يقدر يتبدل على حساب المنطقة.
  escalade_ar: إلا كان الرحيل لمدينة أخرى ولا حالة معقدة، نقدرو نحولوك لمستشار.
  title_arabizi: Nr7el lkhat lfixe wla internet l dar jdida
  objet_arabizi: Nchr7ou kifach tn9el lkhat lfixe wla l'abonnement dyal internet l 3onwan jdid.
  etapes_arabizi:
    - T2akked men l'eligibilite dyal l3onwan jdid (chouf « Wach la fibre kayna 3ndi »).
    - Dir talab dyal tbdil l3onwan men l'espace client wla f lwkala, w l2a7ssan 9bel ma tr7el.
    - 3ti l3onwan jdid kamel w chi wati9a ila tlbouha.
    - Khtar rendez-vous dyal tterkib f l3onwan jdid w 7tafed b l2ajhiza (lbox, decodeur).
  conditions_arabizi:
    - Mol l'abonnement howa li kaydir talab.
    - Khass l'abonnement ykoun mkhlles.
  limites_arabizi:
    - Ila l3onwan jdid ma fihch nfs technologie, y9der yt9tare7 3ard akhor.
    - Numero dyal fixe y9der ytbddel 3la 7sab lmanti9a.
  escalade_arabizi: Ila kan r7il l mdina okhra wla 7ala m3a99da, n9dro n7awlouk l conseiller.

home_line_activation:
  title_fr: Ligne fixe installée mais pas encore active
  objet_fr: Aider le client dont la ligne fixe ou internet a été commandée ou installée mais n'est pas encore activée.
  etapes_fr:
    - Retrouver le numéro de commande et vérifier l'étape « Activation » dans le suivi de commande.
    - Après l'installation, attendre le délai d'activation indiqué dans le message de confirmation.
    - Redémarrer la box et vérifier les voyants une fois le délai passé.
    - Si la ligne n'est toujours pas active, déposer une réclamation « Activation en attente ».
  conditions_fr:
    - L'installation physique doit être terminée.
    - Les documents demandés à la souscription doivent être complets.
  limites_fr:
    - L'assistant ne peut pas activer une ligne.
  escalade_fr: Si le délai d'activation est dépassé, transmettre à un conseiller.
  title_ar: الخط الثابت تركب ولكن باقي ما تفعلش
  objet_ar: نعاونو الكليان اللي الخط الثابت ولا الأنترنيت ديالو تطلب ولا تركب ولكن باقي ما تفعلش.
  etapes_ar:
    - لقى رقم الطلب وشوف المرحلة «التفعيل» فالتتبع ديال الطلب.
    - من بعد التركيب، تسنى المدة ديال التفعيل اللي مكتوبة فميساج التأكيد.
    - طفي وشعل البوكس وشوف الضواو ملي تفوت المدة.
    - إلا الخط باقي ما تفعلش، دير شكاية «التفعيل باقي».
  conditions_ar:
    - خاص التركيب يكون سالا.
    - خاص الوثائق اللي تطلبو نهار الاشتراك يكونو كاملين.
  limites_ar:
    - المساعد ما يقدرش يفعل الخط.
  escalade_ar: إلا فاتت المدة ديال التفعيل، كنحولوك لمستشار.
  title_arabizi: Lkhat lfixe trekkeb walakin ba9i ma tfa3elch
  objet_arabizi: N3awnou lclient li lkhat lfixe wla internet dyalo ttleb wla trekkeb walakin ba9i ma tfa3elch.
  etapes_arabizi:
    - L9a numero dyal talab w chouf lmar7ala « Tfe3il » f suivi dyal talab.
    - Men ba3d tterkib, tsenna lmodda dyal tfe3il li mktouba f message dyal confirmation.
    - Tfi w ch3el lbox w chouf dwaw mli tfout lmodda.
    - Ila lkhat ba9i ma tfa3elch, dir chkaya « Tfe3il ba9i ».
  conditions_arabizi:
    - Khass tterkib ykoun sala.
    - Khass lwata2i9 li ttelbou nhar l'abonnement ykounou kamlin.
  limites_arabizi:
    - Lmousa3id ma y9derch yfa3el lkhat.
  escalade_arabizi: Ila fatet lmodda dyal tfe3il, kan7awlouk l conseiller.

home_line_suspend_restore:
  title_fr: Suspendre ou rétablir la ligne fixe
  objet_fr: Expliquer comment suspendre temporairement la ligne fixe ou internet, ou la rétablir après une suspension ou une coupure pour impayé.
  etapes_fr:
    - Pour une suspension temporaire (absence, voyage), faire la demande dans l'espace client en indiquant la période.
    - Pour rétablir après une suspension volontaire, utiliser « Réactiver ma ligne » dans la même rubrique.
    - Après une coupure pour impayé, régler la facture en attente (voir « Payer sa facture maintenant »).
    - Redémarrer la box une fois le rétablissement confirmé.
  conditions_fr:
    - La suspension temporaire est limitée dans le temps selon les conditions de l'offre.
    - Le rétablissement après impayé suppose le paiement complet des sommes dues.
  limites_fr:
    - Le rétablissement peut prendre un peu de temps après le paiement.
  escalade_fr: Si la ligne reste coupée après paiement, voir « Paiement effectué mais non pris en compte » et un conseiller.
  title_ar: نوقف ولا نرجع الخط الثابت
  objet_ar: نشرحو كيفاش توقف الخط الثابت ولا الأنترنيت لواحد المدة، ولا ترجعو من بعد توقيف ولا قطع على قبل ما خلصتيش.
  etapes_ar:
    - باش توقفو لواحد المدة (غياب، سفر)، دير الطلب فالفضاء ديال الكليان وقول المدة.
    - باش ترجعو من بعد توقيف درتيه بيدك، استعمل «رجع الخط ديالي» فنفس البلاصة.
    - إلا تقطع على قبل ما خلصتيش، خلص الفاتورة اللي باقا (شوف «نخلص الفاتورة دابا»).
    - طفي وشعل البوكس ملي يتأكد الرجوع.
  conditions_ar:
    - التوقيف المؤقت محدود فالوقت على حساب الشروط ديال العرض.
    - الرجوع من بعد عدم الخلاص كيتطلب تخلص كلشي اللي عليك.
  limites_ar:
    - الرجوع يقدر ياخد شوية ديال الوقت من بعد الخلاص.
  escalade_ar: إلا بقا الخط مقطوع من بعد الخلاص، شوف «خلصت والخلاص ما تسجلش» وطلب مستشار.
  title_arabizi: Nwe99ef wla nrjje3 lkhat lfixe
  objet_arabizi: Nchr7ou kifach twe99ef lkhat lfixe wla internet l wa7d lmodda, wla trjj3o men ba3d twe9if wla 9te3 3la 9bel ma khllestich.
  etapes_arabizi:
    - Bach twe99fo l wa7d lmodda (ghiyab, safar), dir talab f l'espace client w goul lmodda.
    - Bach trjj3o men ba3d twe9if dertih b yeddek, sta3mel « Rjje3 lkhat dyali » f nfs lblasa.
    - Ila tkte3 3la 9bel ma khllestich, khlles lfatoura li ba9a (chouf « Nkhlles lfatoura daba »).
    - Tfi w ch3el lbox mli ytt2akked rjou3.
  conditions_arabizi:
    - Twe9if lmo2a99at m7doud f lwe9t 3la 7sab chorout dyal l3ard.
    - Rjou3 men ba3d 3adam lkhlas kayttleb tkhlles kolchi li 3lik.
  limites_arabizi:
    - Rjou3 y9der yakhod chwiya dyal lwe9t men ba3d lkhlas.
  escalade_arabizi: Ila b9a lkhat ma9tou3 men ba3d lkhlas, chouf « Khllest w lkhlas ma tsjjelch » w tleb conseiller.

ownership_transfer:
  title_fr: Changer le titulaire de la ligne
  objet_fr: Expliquer le changement de titulaire d'une ligne (cession à une autre personne, titulaire décédé ou parti).
  etapes_fr:
    - Le titulaire actuel et le nouveau titulaire se présentent en agence avec leurs pièces d'identité.
    - En cas de décès du titulaire, un proche présente l'acte de décès et un document prouvant son lien ou sa qualité d'héritier.
    - Signer le formulaire de changement de titulaire ; le nouveau titulaire reprend l'abonnement.
    - Conserver le récépissé de la demande.
  conditions_fr:
    - Les factures en cours doivent être réglées avant le changement.
    - Le nouveau titulaire doit être majeur.
  limites_fr:
    - Le changement de titulaire ne se fait pas par message ni par l'assistant.
    - Les documents exacts peuvent varier selon la situation.
  escalade_fr: Toute demande de changement de titulaire passe par un conseiller ou une agence.
  title_ar: نبدل مول الخط
  objet_ar: نشرحو كيفاش يتبدل مول الخط (نعطيه لشي واحد آخر، مول الخط توفى ولا مشا).
  etapes_ar:
    - مول الخط الحالي واللي غادي ياخدو كيمشيو للوكالة بالبطاقات الوطنية ديالهم.
    - إلا مول الخط توفى، شي واحد من العائلة كيجيب شهادة الوفاة وشي وثيقة كتبين العلاقة ولا بلي وارث.
    - توقع الاستمارة ديال تبديل مول الخط، والجديد كيكمل بالاشتراك.
    - احتافظ بالوصل ديال الطلب.
  conditions_ar:
    - خاص الفواتير اللي باقين يتخلصو قبل التبديل.
    - خاص مول الخط الجديد يكون راشد.
  limites_ar:
    - تبديل مول الخط ما كيتدارش بميساج ولا عن طريق المساعد.
    - الوثائق بالضبط يقدرو يختلفو على حساب الحالة.
  escalade_ar: أي طلب ديال تبديل مول الخط كيدوز عن طريق مستشار ولا الوكالة.
  title_arabizi: Nbddel mol lkhat
  objet_arabizi: Nchr7ou kifach ytbddel mol lkhat (n3tih l chi wa7d akhor, mol lkhat twffa wla mcha).
  etapes_arabizi:
    - Mol lkhat l7ali w li ghadi yakhdo kaymchiw l lwkala b les cartes nationales dyalhom.
    - Ila mol lkhat twffa, chi wa7d men l3a2ila kayjib chahadat lwafat w chi wati9a katbiyen l3ala9a wla beli wares.
    - Ttwe99a3 le formulaire dyal tbdil mol lkhat, w jdid kaykemmel b l'abonnement.
    - 7tafed b lwasl dyal talab.
  conditions_arabizi:
    - Khass lfwatir li ba9yin ytkhllsou 9bel tbdil.
    - Khass mol lkhat jdid ykoun rached.
  limites_arabizi:
    - Tbdil mol lkhat ma kayttdarch b message wla 3an tari9 lmousa3id.
    - Lwata2i9 b dabt y9dro ykhtalfou 3la 7sab l7ala.
  escalade_arabizi: Ay talab dyal tbdil mol lkhat kaydouz 3an tari9 conseiller wla lwkala.

adsl_to_fiber_migration:
  title_fr: Passer de l'ADSL à la fibre
  objet_fr: Expliquer comment migrer une ligne ADSL existante vers la fibre.
  etapes_fr:
    - Vérifier l'éligibilité fibre de l'adresse.
    - Demander la migration dans l'espace client ou en agence en choisissant une offre fibre.
    - Prendre rendez-vous pour l'installation de la prise fibre et de la nouvelle box.
    - Après l'activation de la fibre, rendre l'ancienne box ADSL (voir « Retour d'équipement »).
  conditions_fr:
    - L'adresse doit être éligible à la fibre.
    - L'abonnement ADSL doit être à jour de ses paiements.
  limites_fr:
    - Une courte coupure peut avoir lieu le jour de la bascule.
    - Le numéro fixe est en principe conservé, sauf contrainte technique.
  escalade_fr: Si la migration bloque après l'installation, proposer un conseiller.
  title_ar: ندوز من ADSL لـلافيبر
  objet_ar: نشرحو كيفاش تبدل خط ADSL لـلافيبر.
  etapes_ar:
    - تأكد بلي العنوان مؤهل لـلافيبر.
    - طلب التبديل فالفضاء ديال الكليان ولا فالوكالة واختار عرض ديال لافيبر.
    - دير موعد باش يركبو البريز ديال لافيبر والبوكس الجديدة.
    - من بعد ما تفعل لافيبر، رجع البوكس القديمة ديال ADSL (شوف «نرجع الأجهزة»).
  conditions_ar:
    - خاص العنوان يكون مؤهل لـلافيبر.
    - خاص الاشتراك ديال ADSL يكون مخلص.
  limites_ar:
    - يقدر يوقع شي انقطاع قصير نهار التبديل.
    - رقم الفيكس فالعادة كيبقى، إلا إلا كان شي مشكل تقني.
  escalade_ar: إلا التبديل وقف من بعد التركيب، نقدرو نحولوك لمستشار.
  title_arabizi: Ndouz men ADSL l la fibre
  objet_arabizi: Nchr7ou kifach tbddel khat ADSL l la fibre.
  etapes_arabizi:
    - T2akked beli l3onwan mo2ahal l la fibre.
    - Tleb tbdil f l'espace client wla f lwkala w khtar 3ard dyal la fibre.
    - Dir rendez-vous bach yrekkbou la prise dyal la fibre w lbox jdida.
    - Men ba3d ma ttfa3el la fibre, rjje3 lbox l9dima dyal ADSL (chouf « Nrjje3 lbox, routeur wla decodeur »).
  conditions_arabizi:
    - Khass l3onwan ykoun mo2ahal l la fibre.
    - Khass l'abonnement dyal ADSL ykoun mkhlles.
  limites_arabizi:
    - Y9der yw9e3 chi in9ita3 9sir nhar tbdil.
    - Numero dyal fixe f l3ada kayb9a, ghir ila kan chi mochkil te9ni.
  escalade_arabizi: Ila tbdil w9ef men ba3d tterkib, n9dro n7awlouk l conseiller.

fixed_phone_issue:
  title_fr: Problème de téléphone fixe
  objet_fr: Aider le client dont le téléphone fixe ne fonctionne pas (pas de tonalité, appels impossibles, problème de numéro).
  etapes_fr:
    - Vérifier que le téléphone est bien branché sur le port téléphone de la box et que la box fonctionne.
    - Tester avec un autre combiné si possible.
    - Redémarrer la box ; la ligne fixe passe par la box sur les offres internet.
    - Vérifier dans l'espace client que la ligne fixe est active et non suspendue.
  conditions_fr:
    - Sur les offres internet, le fixe ne fonctionne que si la box est allumée et connectée.
  limites_fr:
    - L'assistant ne peut pas tester la ligne ni changer le numéro.
  escalade_fr: Si la tonalité ne revient pas après ces vérifications, transmettre à un conseiller.
  title_ar: مشكل فالتيليفون الثابت
  objet_ar: نعاونو الكليان اللي التيليفون الثابت ديالو ما خدامش (ما كاينش الصوت، ما كيقدرش يعيط، مشكل فالنمرة).
  etapes_ar:
    - تأكد بلي التيليفون مربوط مزيان فالبلاصة ديال التيليفون فالبوكس وبلي البوكس خدامة.
    - جرب بتيليفون آخر إلا ممكن.
    - طفي وشعل البوكس، حيت الفيكس كيدوز من البوكس فعروض الأنترنيت.
    - شوف فالفضاء ديال الكليان واش الخط الثابت خدام وماشي موقوف.
  conditions_ar:
    - فعروض الأنترنيت، الفيكس ما كيخدمش غير إلا كانت البوكس مشعلة ومربوطة.
  limites_ar:
    - المساعد ما يقدرش يجرب الخط ولا يبدل النمرة.
  escalade_ar: إلا الصوت ما رجعش من بعد هاد الخطوات، كنحولوك لمستشار.
  title_arabizi: Mochkil f tilifon lfixe
  objet_arabizi: N3awnou lclient li tilifon lfixe dyalo ma khdamch (ma kaynch sout, ma kay9derch y3iyet, mochkil f nmra).
  etapes_arabizi:
    - T2akked beli tilifon merbout mzyan f lblasa dyal tilifon f lbox w beli lbox khddama.
    - Jerreb b tilifon akhor ila momkin.
    - Tfi w ch3el lbox, 7it lfixe kaydouz men lbox f 3rod internet.
    - Chouf f l'espace client wach lkhat lfixe khdam w machi mwe99ef.
  conditions_arabizi:
    - F 3rod internet, lfixe ma kaykhdem ghir ila kanet lbox mch3la w merbouta.
  limites_arabizi:
    - Lmousa3id ma y9derch yjerreb lkhat wla ybddel nmra.
  escalade_arabizi: Ila sout ma rje3ch men ba3d had lkhatawat, kan7awlouk l conseiller.

equipment_return:
  title_fr: Rendre la box, le routeur ou le décodeur
  objet_fr: Expliquer comment rendre le matériel prêté (box, routeur, décodeur), par exemple après une résiliation.
  etapes_fr:
    - Réunir le matériel complet avec ses câbles et son alimentation.
    - Le déposer dans une agence et demander un reçu de restitution.
    - Conserver ce reçu jusqu'à la clôture définitive du compte.
  conditions_fr:
    - Le matériel doit être rendu dans le délai indiqué après la résiliation.
    - Le matériel prêté reste la propriété de l'opérateur.
  limites_fr:
    - Un matériel non rendu ou incomplet peut être facturé selon les conditions de l'offre.
    - L'assistant ne peut pas enregistrer la restitution.
  escalade_fr: Si le matériel rendu est encore facturé, transmettre à un conseiller avec le reçu.
  title_ar: نرجع البوكس، الروتور ولا الديكودور
  objet_ar: نشرحو كيفاش ترجع الأجهزة اللي عطاوك (البوكس، الروتور، الديكودور)، مثلا من بعد ما تحيد الاشتراك.
  etapes_ar:
    - جمع الجهاز كامل بالكابلات والضو ديالو.
    - دفعو فالوكالة وطلب وصل ديال الإرجاع.
    - احتافظ بهاد الوصل حتى يتسد الحساب نهائيا.
  conditions_ar:
    - خاص الجهاز يترجع فالوقت المحدد من بعد إلغاء الاشتراك.
    - الجهاز اللي عطاوك كيبقى ديال الأوبيراتور.
  limites_ar:
    - الجهاز اللي ما ترجعش ولا ناقص يقدر يتخلص على حساب الشروط ديال العرض.
    - المساعد ما يقدرش يسجل الإرجاع.
  escalade_ar: إلا رجعتي الجهاز وباقي كيتخلص عليك، كنحولوك لمستشار مع الوصل.
  title_arabizi: Nrjje3 lbox, routeur wla decodeur
  objet_arabizi: Nchr7ou kifach trjje3 l2ajhiza li 3tawk (lbox, routeur, decodeur), matalan men ba3d ma t7iyed l'abonnement.
  etapes_arabizi:
    - Jme3 ljihaz kamel b les cables w ddaw dyalo.
    - Dfe3o f lwkala w tleb wasl dyal l'irja3.
    - 7tafed b had lwasl 7ta ytsedd lcompte nihai2iyan.
  conditions_arabizi:
    - Khass ljihaz ytrjje3 f lwe9t lm7added men ba3d ilgha2 l'abonnement.
    - Ljihaz li 3tawk kayb9a dyal l'operateur.
  limites_arabizi:
    - Ljihaz li ma trje3ch wla na9es y9der ytkhlles 3la 7sab chorout dyal l3ard.
    - Lmousa3id ma y9derch ysjjel l'irja3.
  escalade_arabizi: Ila rjje3ti ljihaz w ba9i kaytkhlles 3lik, kan7awlouk l conseiller m3a lwasl.
