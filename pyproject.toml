[project]
name = "darijacare"
version = "0.1.0"
description = "DarijaCare : service client télécom en darija marocaine (projet académique PFA, données publiques synthétiques)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0 (code) ; données CC BY 4.0 (voir CREDITS.md)" }
authors = [
    { name = "Oussama BANANI" },
    { name = "Aymene ESSIFI" },
    { name = "Houssam SABER" },
]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pandera>=0.20",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
pipeline = ["dvc>=3.50"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.8",
]

[project.scripts]
darijacare-data = "darijacare.data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darijacare"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caractères arabes « ambigus » volontaires
    "SIM905",  # lexiques écrits en """...""".split() pour la lisibilité
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["darijacare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "data: tests sur les vraies données (nécessite data/raw, sinon ignorés)",
]
