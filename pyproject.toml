[project]
name = "darijacare"
version = "0.1.0"
description = "DarijaCare : service client télécom en darija marocaine (projet académique PFA, données publiques synthétiques)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0 (code) ; données CC BY 4.0 (voir CREDITS.md)" }
authors = [
    { name = "Oussama BANANI" },
    { name = "Aymene ESSIFI" },
    { name = "Houssam SABER" },
]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pandera>=0.20",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "huggingface-hub>=0.25",
    "jinja2>=3.1",
    "qdrant-client==1.20.0",
]

[project.optional-dependencies]
pipeline = ["dvc>=3.50"]
# Modèle publié : versions imposées par sa fiche (laya 0.3.28, transformers 4.57.6).
# MLflow aligné sur l'image du serveur docker-compose. 3.18.0 (Phase 6) : corrige les avis
# critiques de la 2.17.2 relevés par pip-audit (docs/securite.md).
nlu = [
    "transformers==4.57.6",
    "laya==0.3.28",
    "safetensors>=0.4",
    "mlflow==3.18.0",
    # SQLAlchemy 2.0.x : version testée (MLflow 2.17 cassait avec la 2.1).
    "sqlalchemy>=2.0,<2.1",
]
# RAG : BGE-M3 (dense + creux) via la bibliothèque officielle de BAAI.
rag = ["FlagEmbedding==1.4.2"]
# API (Phase 4) : FastAPI, PostgreSQL (psycopg 3), migrations Alembic, Argon2id, JWT.
# Versions publiées depuis au moins deux semaines au moment du choix (novembre 2026).
api = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy>=2.0,<2.1",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.7",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
]
# Variante de torch (extras exclusifs) : `--extra cpu` (léger, par défaut) ou `--extra cu126`
# (CUDA 12.6 : dernière combinaison qui prend encore en charge les GPU Pascal, sm_61).
cpu = ["torch==2.7.1"]
cu126 = ["torch==2.7.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
# Dépendances transitives ajoutées en Phase 6 (MLflow 3.18) : versions publiées depuis au
# moins 14 jours, comme les dépendances directes.
exclude-newer-package = { prettytable = "2026-11-04T00:00:00Z", python-multipart = "2026-11-04T00:00:00Z" }

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.8",
    "testcontainers==4.15.0",
]
load = [
    "locust==2.47.0",
]

[project.scripts]
darijacare-data = "darijacare.data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darijacare"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caractères arabes « ambigus » volontaires
    "SIM905",  # lexiques écrits en """...""".split() pour la lisibilité
]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : les dépendances et paramètres se déclarent en valeur par défaut.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["darijacare"]

# torch n'est pas installé dans le job de typage de la CI : les `type: ignore` propres à
# torch y seraient « inutilisés » ; on ne les signale donc pas dans ces modules.
[[tool.mypy.overrides]]
module = ["darijacare.nlu.train", "darijacare.quality.latency"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "data: tests sur les vraies données (nécessite data/raw, sinon ignorés)",
    "postgres: tests sur le PostgreSQL de docker-compose (ignorés s'il est absent)",
    "integration: Testcontainers, API <-> PostgreSQL <-> Qdrant (ignorés sans Docker)",
]
filterwarnings = [
    # Avertissement interne de starlette.testclient (dépendance httpx), sans effet sur nos tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
