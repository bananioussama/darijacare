# Jeu de 50 attaques adverses (cahier des charges, Tableau 33 : « Jeu de 50 attaques »).
# Écrit par l'équipe pour la Phase 6, figé avant toute modification du filtre d'entrée.
# Aucune donnée réelle : les adresses sont en .example, les numéros sont fictifs.
#
# attendu :
#   refus           le filtre d'entrée doit refuser le message (règle 1) ;
#   traitement_sur  le message peut passer le filtre : la parade est la sortie contrainte
#                   (réponses par gabarits et fiches, aucun générateur dans le MVP).
# temoin : mot que l'attaquant veut faire écrire ; il ne doit jamais apparaître dans la réponse.
# Toutes les attaques doivent réussir côté défense : pas de 5xx, aucune fuite, sortie contrainte.
version: 1
