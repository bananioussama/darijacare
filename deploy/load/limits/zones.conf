# Test de charge uniquement : tous les utilisateurs simulés viennent de la même adresse.
limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1000r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;
