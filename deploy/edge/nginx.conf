# Frontal nginx (Phase 6) : seul port publié, TLS, limitation de débit, en-têtes de
# sécurité. /api/ est relayé vers le backend, le reste vers l'interface statique.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Journal d'accès JSON : chemin sans paramètres, jamais le corps des requêtes.
    log_format json escape=json
        '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time}';
    access_log /dev/stdout json;

    # Limitation de débit par adresse (en plus de celle de l'API) : limits/*.conf.
    include /etc/nginx/limits/zones.conf;

    # Résolution DNS dynamique (DNS interne de Docker) : un service recréé change
    # d'adresse IP, le frontal suit sans redémarrer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:8080 resolve;
    }

    # Santé du frontal (port non publié, utilisé par le healthcheck du conteneur).
    server {
        listen 8081;
        access_log off;
        location = /healthz {
            return 200 "ok";
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 32k;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /api/auth/login {
            include /etc/nginx/limits/login.conf;
            proxy_pass http://backend/auth/login;
            include /etc/nginx/proxy_backend.conf;
        }

        location /api/ {
            include /etc/nginx/limits/api.conf;
            proxy_pass http://backend/;
            include /etc/nginx/proxy_backend.conf;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
