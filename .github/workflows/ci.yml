name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.10.11"

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline --extra api
      - run: uv run ruff check src tests tools migrations
      - run: uv run black --check src tests tools migrations
      - run: uv run mypy

  tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline --extra api
      # Les tests PostgreSQL de docker-compose sont ignorés en CI (pas de serveur) ; les tests
      # d'intégration Testcontainers (tests/integration) lancent leurs propres conteneurs
      # PostgreSQL 16.4 et Qdrant 1.20.0 avec le Docker du runner.
      - run: uv run pytest --cov=darijacare --cov-report=term-missing --cov-fail-under=70

  images:
    name: Construction des images Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Construites seulement (aucune publication) ; les modèles sont montés à l'exécution.
      # Compose lit .env et exige POSTGRES_PASSWORD même pour construire : valeurs factices.
      - run: cp .env.example .env
      - run: docker compose build backend frontend
        env:
          POSTGRES_PASSWORD: construction-seulement
      - run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep darijacare

  audit:
    name: Audit des dépendances Python (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: >
          uv export --locked --format requirements-txt --no-hashes --no-emit-project
          --extra nlu --extra rag --extra api --extra cpu --no-dev > requirements-prod.txt
      # Risques résiduels acceptés et justifiés dans docs/securite.md (transformers figé par
      # la fiche du modèle ; fsspec et datasets transitifs, fonctions non utilisées). Tout
      # nouvel avis fait échouer la CI.
      - run: >
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r requirements-prod.txt
          --ignore-vuln PYSEC-2026-3716 --ignore-vuln PYSEC-2026-4217
          --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174

  frontend:
    name: Interface (types, formatage, tests, construction)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Dépendances livrées au navigateur uniquement (voir docs/frontend.md).
      - run: npm audit --omit=dev --audit-level=high
      # Les parcours E2E Playwright (e2e/) demandent la pile complète avec les modèles :
      # ils tournent en local (make e2e), pas en CI.

  data-pipeline:
    name: Rejeu du pipeline DVC (données du Hub, révision figée)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline
      - name: Rejouer tout le pipeline depuis les données brutes
        run: |
          cp dvc.lock /tmp/reference.lock
          uv run dvc repro --force
      - name: Vérifier les empreintes des données
        run: uv run python tools/check_lock.py /tmp/reference.lock dvc.lock
      # Seulement tests/data : ce job n'installe que l'extra pipeline, et les tests de l'API
      # (FastAPI, SQLAlchemy) ne pourraient pas être collectés.
      - name: Tests sur les données produites
        run: uv run pytest -m data tests/data
