name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.10.11"

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests tools
      - run: uv run black --check src tests tools
      - run: uv run mypy

  tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov=darijacare --cov-report=term-missing

  data-pipeline:
    name: Rejeu du pipeline DVC (données du Hub, révision figée)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - name: Rejouer tout le pipeline depuis les données brutes
        run: |
          cp dvc.lock /tmp/reference.lock
          uv run dvc repro --force
      - name: Vérifier les empreintes des données
        run: uv run python tools/check_lock.py /tmp/reference.lock dvc.lock
      - name: Tests sur les données produites
        run: uv run pytest -m data
