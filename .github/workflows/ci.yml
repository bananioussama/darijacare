name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.10.11"

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline --extra api
      - run: uv run ruff check src tests tools migrations
      - run: uv run black --check src tests tools migrations
      - run: uv run mypy

  tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline --extra api
      # Les tests PostgreSQL sont ignorés en CI (pas de serveur) ; ils tournent en local.
      - run: uv run pytest --cov=darijacare --cov-report=term-missing

  frontend:
    name: Interface (types, formatage, tests, construction)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Dépendances livrées au navigateur uniquement (voir docs/frontend.md).
      - run: npm audit --omit=dev --audit-level=high

  data-pipeline:
    name: Rejeu du pipeline DVC (données du Hub, révision figée)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra pipeline
      - name: Rejouer tout le pipeline depuis les données brutes
        run: |
          cp dvc.lock /tmp/reference.lock
          uv run dvc repro --force
      - name: Vérifier les empreintes des données
        run: uv run python tools/check_lock.py /tmp/reference.lock dvc.lock
      - name: Tests sur les données produites
        run: uv run pytest -m data
