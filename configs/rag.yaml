# RAG DarijaCare (Phase 3) — Tableau 21 du cahier des charges.
kb_dir: kb
embedder:
  model_path: models/bge-m3                # BAAI/bge-m3 @ 5617a9f61b028005a4858fdac845db406aefb181 (MIT)
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  weights_sha256: b5e0ce3470abf5ef3831aa1bd5553b486803e83251590ab7ff35a117cf6aad38
  batch_size: 16
  max_length: 512
  use_fp16: false                          # true seulement sur GPU
qdrant:
  # QDRANT_URL (docker-compose) prioritaire ; sinon mode local embarqué dans ce dossier.
  local_path: data/qdrant
  collection: kb_fiches
retrieval:
  top_k: 10                                # par voie (dense, creuse) avant fusion
  rrf_k: 60
  top_n: 3                                 # fiches renvoyées
  use_intent_filter: true
  # Priorité NLU : first (fiche de l'intention prédite en tête), rrf (3e liste RRF), none.
  # Choix fait sur des données propres (v3, validation rondes 4 et 6) : voir docs/rag.md.
  nlu_prior: first
  neighbours: 3                            # intentions voisines ajoutées au filtre
  neighbours_file: reports/nlu/neighbours.json
  # Plancher sur la similarité dense de la fiche retenue : en dessous, pas de source fiable
  # (réponse prudente + proposition de conseiller). Choisi sur la validation propre (v3,
  # rondes 4 et 6) : signal faible (AUC 0,62) ; 0,30 écarte 1,3 % des messages, justes à 67 %
  # contre 79 % pour les autres (voir docs/rag.md §5).
  min_dense_score: 0.30
