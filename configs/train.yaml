# Configuration NLU (Phase 2). Les seuils et hyperparamètres se choisissent sur la validation uniquement.
seed: 42

baseline:
  text_column: text_norm
  analyzer: char_wb
  ngram_range: [2, 5]
  min_df: 2
  max_features: 400000
  sublinear_tf: true
  C: 0.5
  max_iter: 5000
  balanced_tasks: [needs_human, urgency]

# Modèles publiés (mballouch/jev-darija-telecom-model) et chiffres de leur fiche (test officiel).
published_models:
  v5:
    path: models/jev-darija-telecom-model
    repo: mballouch/jev-darija-telecom-model
    revision: 8e694ecf05de3ef6cd9de14317d996d38079af83
    weights_sha256: a2130760903dc24269884875ed1b0a7889df5b30df13370e9009d13d4784f3f8
    trained_on: "40 357 messages (train complet, 10 % retenus par l'auteur pour la sélection d'époque)"
    published:
      intent_end_to_end: 89.6
      category_acc: 92.7
      intent_given_category: 95.9
      product_acc: 89.1
      urgency_acc: 80.8
      needs_human_acc: 94.7
      by_script: {arabic: 89.7, arabizi: 88.7, mixed: 90.5}
  v3:
    path: models/jev-darija-telecom-model-v3
    repo: mballouch/jev-darija-telecom-model
    revision: 704030997d
    weights_sha256: 8caeb28ea0a2c107c720c3a60cc7d929840ec6903c755df962a8b7533350088f
    trained_on: "18 350 messages = rondes 1, 2 et 3"
    published:
      intent_end_to_end: 84.6
      category_acc: 89.4
      intent_given_category: 93.3
      product_acc: 89.9
      urgency_acc: 80.8
      needs_human_acc: 95.3
      by_script: {arabic: 84.8, arabizi: 82.9, mixed: 86.5}

reproduction_tolerance_points: 1.0
serving_model: v5

calibration:
  per_script: true
  needs_human_min_recall: 0.85
  needs_human_min_precision: 0.70
  intent_target_accuracy: 0.95
  ece_target: 0.05

# Ré-entraînement (protocole de la fiche v5) sur NOTRE découpage train/val.
retrain:
  start_checkpoint: models/jev-darija      # mballouch/jev-darija @ bf18d80a39d03176849e68d0510a87112d321d2a
  start_revision: bf18d80a39d03176849e68d0510a87112d321d2a
  epochs: 9                # fiche v5 : meilleure de 9 époques (v3 : 8)
  micro_batch: 8
  grad_accum: 4            # batch effectif 32
  encoder_lr: 3.0e-5
  head_lr: 1.0e-4
  min_lr: 0.0
  warmup_frac: 0.06
  weight_decay: 0.01       # valeur par défaut de laya.train (non précisée par la fiche)
  grad_clip: 1.0           # idem
  label_smoothing: 0.05
  shuffle_options: [choice]
  amp: true                # fp16 sur GPU
  gradient_checkpointing: true
  seeds: [42, 43, 44]
  val_batch_size: 32
